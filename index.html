<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Al Mossad Store | آل مسعد</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Prevent stale index.html cache after deploy -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      // Global chunk-load error recovery – handles Products-DP3gP23X.js, Coupons-B6BT1yjJ.js, etc. for any stale deploy
      (function() {
        var isChunk = function(msg){ var m=String(msg||'').toLowerCase(); return m.indexOf('failed to fetch dynamically imported module')>-1 || m.indexOf('loading chunk')>-1 || m.indexOf('chunkloaderror')>-1; };
        var reload = function(){
          var k='global-chunk-reload';
          var last=sessionStorage.getItem(k);
          var now=Date.now();
          if(!last || now-parseInt(last,10)>10000){
            sessionStorage.setItem(k, String(now));
            var url=new URL(window.location.href);
            url.searchParams.set('_r', String(now));
            window.location.replace(url.toString());
          }
        };
        window.addEventListener('error', function(e){ if(isChunk(e.message||e.error&&e.error.message)){ reload(); } });
        window.addEventListener('unhandledrejection', function(e){ var m=e.reason&&e.reason.message||String(e.reason||''); if(isChunk(m)){ reload(); } });
        setTimeout(function(){ sessionStorage.removeItem('global-chunk-reload'); }, 8000);
      })();
    </script>
    <script>
      // GitHub Pages SPA Fix - يستعيد المسار الصح من الـ query param
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded[0] +
            (decoded[1] ? '?' + decoded[1] : '') +
            l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
